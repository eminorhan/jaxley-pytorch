# Control: a student of the 16-type teacher that starts from the teacher's own parameters.
experiment_name = "t16_control"
seeds = [0]

[init]
teacher = "t16_teacher/seed0"
start = "teacher"

[task]
name = "text"
data = "/nrs/scicompsoft/orhane/jaxley-pytorch-experiments/activitome-connectome/task-complexity/data/bpe4096"
steps_per_token = 200
chunk = 256
eval_segments = 64
eval_burn = 32
eval_length = 256

[trainer]
trainable = ["gNa", "gK", "gKm", "gLeak", "bias"]
steps = 5000
warmup_steps = 250
batch = 32
lr = 5e-3  # the teacher's schedule
optimizer = "adamw"
weight_decay = 0.0
clip = 2.0
clip_mode = "global"
eval_every = 250
log_every = 10
dtype = "float32"
checkpoint_every = 500

# Pilot (stage 1): the seed-1 student of pilot_hh_students.toml at peak learning rate 3e-3 for 2,000 steps.
experiment_name = "pilot_hh_students_lr3e-3"
seeds = [1]

[init]
teacher = "pilot_hh_lr3e-3_teacher/seed0"
start = "shuffled"

[task]
name = "text"
data = "/nrs/scicompsoft/orhane/jaxley-pytorch-experiments/activitome-connectome/task-complexity/data/bpe4096"
width = 75
steps_per_token = 200
chunk = 256
eval_segments = 64
eval_burn = 32
eval_length = 256

[trainer]
trainable = ["gNa", "gK", "gLeak", "bias"]
steps = 2000
warmup_steps = 100
batch = 32
lr = 3e-3
optimizer = "adamw"
weight_decay = 0.0
clip = 2.0
clip_mode = "global"
eval_every = 100
log_every = 10
dtype = "float32"
checkpoint_every = 250

# Control: a student of the 600-neuron teacher that starts from the teacher's own gains and biases (as tokens_control.toml).
experiment_name = "n600_control"
seeds = [0]

[init]
teacher = "n600_teacher/seed0"
start = "teacher"

[task]
name = "text"
data = "/nrs/scicompsoft/orhane/jaxley-pytorch-experiments/activitome-connectome/task-complexity/data/bpe4096"
width = 75
steps_per_token = 10
chunk = 256
eval_segments = 64
eval_burn = 32
eval_length = 256

[trainer]
trainable = ["g", "b"]
steps = 10000
warmup_steps = 500
batch = 32
lr = 1e-3
optimizer = "adamw"
weight_decay = 0.0
clip = 2.0
clip_mode = "global"
eval_every = 250
log_every = 50
dtype = "float32"
checkpoint_every = 1000

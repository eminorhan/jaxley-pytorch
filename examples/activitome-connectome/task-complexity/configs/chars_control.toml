# Control: a student that starts from the teacher's own gains and biases.
experiment_name = "chars_control"
seeds = [0]

[init]
teacher = "chars_teacher/seed0"
start = "teacher"

[task]
name = "text"
data = "/nrs/scicompsoft/orhane/probes/jaxley_pytorch/language_modeling/data"
width = 75
steps_per_token = 10
chunk = 256
eval_segments = 64
eval_burn = 32
eval_length = 256

[trainer]
trainable = ["g", "b"]
steps = 10000
warmup_steps = 500
batch = 32
lr = 1e-3
clip = 2.0
clip_mode = "global"
eval_every = 250
log_every = 50
dtype = "float32"


# The teacher of next-token prediction on TinyStories characters (the recipe of examples/language_modeling).
experiment_name = "chars_teacher"
seeds = [2]  # seed 0 ran away at step 23,390 of 25,000, seed 1 at initialisation (README)

[model]
name = "blk_rate"
neurons = 300
exc_frac = 0.7
connection_prob = 0.5
dt = 0.5

[task]
name = "text"
data = "/nrs/scicompsoft/orhane/probes/jaxley_pytorch/language_modeling/data"
steps_per_token = 10
chunk = 256
eval_segments = 64
eval_burn = 32
eval_length = 256
readout_norm = "rms"  # RMSNorm on the activity before the readout (keeps the rates from running away)

[trainer]
trainable = ["W", "g", "b", "embed", "unembed", "read_bias"]
steps = 25000
warmup_steps = 1250
batch = 32
lr = 3e-3
optimizer = "adam"
weight_decay = 0.0
clip = 1.0
clip_mode = "per_tensor"
eval_every = 1000
log_every = 100
dtype = "float32"


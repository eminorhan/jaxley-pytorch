# The cycling task's teacher: the paper's recipe, 3,000 steps instead of 1,400.
experiment_name = "cycling_teacher"
seeds = [0]

[model]
name = "blk_rate"
neurons = 300
exc_frac = 0.7
connection_prob = 0.5
dt = 0.5

[task]
name = "cycling"
trials = 60
trial_steps = 400
trials_seed = 21
omega = 3.0
train_trials = 0

[trainer]
trainable = ["W", "g", "b", "w_out"]
steps = 3000
warmup_steps = 150
batch = 32
lr = 1e-3
clip = 5.0
clip_mode = "global"
eval_every = 100
log_every = 50
dtype = "float32"

